name: Weekly Watchlist Verification

# Re-checks research-seed employers (careers page / ATS board / Israeli jobs) whose verification is
# older than 30 days, so newly hiring companies start being crawled and dead links stop being crawled.
on:
  schedule:
    - cron: '30 4 * * 0'   # Sunday 04:30 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-crawler
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Verify stale watchlist companies
        run: python watchlist.py verify --max-age-days 30
      - name: Commit verification cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/company_verification_cache.json data/job_updates_audit.jsonl
          git diff --staged --quiet || (git commit -m "Update watchlist verification [skip ci]" && git pull --rebase origin main && git push origin main)
